<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', '微軟正黑體', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2d3748;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
  }

  .card-logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 32px;
  }

  .card-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #1a365d;
    margin-bottom: 4px;
  }

  .card-subtitle {
    text-align: center;
    font-size: 13px;
    color: #718096;
    margin-bottom: 28px;
  }

  .step { display: none; }
  .step.active { display: block; }

  .form-group { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="text"],
  input[type="tel"],
  select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #cbd5e0;
    border-radius: 8px;
    font-size: 15px;
    color: #2d3748;
    transition: border-color 0.2s;
    background: #fff;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #3182ce;
    box-shadow: 0 0 0 3px rgba(49,130,206,0.15);
  }

  .otp-input {
    text-align: center;
    letter-spacing: 0.4em;
    font-size: 22px !important;
    font-weight: 700;
  }

  .btn {
    width: 100%;
    padding: 11px 0;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }

  .btn-primary {
    background: #2b6cb0;
    color: #fff;
  }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-link {
    background: none;
    color: #3182ce;
    font-size: 13px;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
    border: none;
    width: auto;
  }
  .btn-link:hover { color: #2c5282; }

  .btn-secondary {
    background: #e2e8f0;
    color: #4a5568;
  }
  .btn-secondary:hover { background: #cbd5e0; }

  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .alert.show { display: block; }
  .alert-error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
  .alert-success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
  .alert-info { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }

  .hint {
    font-size: 12px;
    color: #718096;
    margin-top: 6px;
  }

  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #cbd5e0;
    transition: background 0.3s;
  }
  .step-dot.active { background: #2b6cb0; }
  .step-dot.done { background: #68d391; }

  .profile-info {
    background: #ebf8ff;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .profile-info p { font-size: 14px; line-height: 1.9; }
  .profile-label { color: #718096; font-size: 12px; display: inline-block; min-width: 60px; }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2b6cb0;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px 10px 0 0;
  }
  .nav-title { font-size: 16px; font-weight: 700; }
  .nav-email { font-size: 12px; opacity: 0.85; }

  .dashboard-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 500px;
    overflow: hidden;
  }

  .dashboard-body { padding: 28px 28px 20px; }

  .resend-row {
    text-align: center;
    margin-top: 10px;
  }

  .divider {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 20px 0;
  }
</style>
